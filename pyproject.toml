[tool.poetry]
name = "nautobot-ssot-proxmox"
version = "1.2.4"
description = "Unofficial Nautobot SSoT sync script to fetch Node data created in Proxmox VE (remote) into Nautobot (local)."
authors = ["HarbourHeading <public.riptide549@passinbox.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
nautobot = "^3.1.3"
nautobot-ssot = "^4.4.0"
proxmoxer = "^2.3.0"
diffsync = "^2.2.3"
cryptography = "^48.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
